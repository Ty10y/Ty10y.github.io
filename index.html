  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:            #050e05;
      --surface:       rgba(8, 26, 8, 0.58);
      --surface-hover: rgba(13, 40, 13, 0.82);
      --green:         #4ade80;
      --green-muted:   #86efac;
      --green-dim:     rgba(74, 222, 128, 0.11);
      --border:        rgba(74, 222, 128, 0.1);
      --border-hover:  rgba(74, 222, 128, 0.35);
      --text:          #f0fdf4;
      --text-muted:    #a7f3d0;
    }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 65% 45% at 12% 18%, rgba(34, 197, 94, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 55% 65% at 88% 78%, rgba(21, 128, 61, 0.10) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Leaves ── */
    .leaves-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .leaf {
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
    }

    .leaf svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Width only — JS handles all motion */
    .leaf:nth-child(1)  { width: 26px; }
    .leaf:nth-child(2)  { width: 17px; }
    .leaf:nth-child(3)  { width: 22px; }
    .leaf:nth-child(4)  { width: 30px; }
    .leaf:nth-child(5)  { width: 19px; }
    .leaf:nth-child(6)  { width: 25px; }
    .leaf:nth-child(7)  { width: 20px; }
    .leaf:nth-child(8)  { width: 15px; }
    .leaf:nth-child(9)  { width: 28px; }
    .leaf:nth-child(10) { width: 18px; }
    .leaf:nth-child(11) { width: 23px; }
    .leaf:nth-child(12) { width: 21px; }
    .leaf:nth-child(13) { width: 24px; }
    .leaf:nth-child(14) { width: 19px; }
    .leaf:nth-child(15) { width: 27px; }
    .leaf:nth-child(16) { width: 16px; }
    .leaf:nth-child(17) { width: 22px; }
    .leaf:nth-child(18) { width: 29px; }
    .leaf:nth-child(19) { width: 18px; }
    .leaf:nth-child(20) { width: 23px; }
    .leaf:nth-child(21) { width: 20px; }
    .leaf:nth-child(22) { width: 25px; }
    .leaf:nth-child(23) { width: 17px; }
    .leaf:nth-child(24) { width: 21px; }

    /* ── Main layout ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px 100px;
    }

    /* ── Hero ── */
    .hero {
      padding: 130px 0 72px;
      text-align: center;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--green);
      border: 1px solid var(--border-hover);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 28px;
    }

    .hero-eyebrow::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: dot-pulse 2.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes dot-pulse {
      0%, 100% { opacity: 1;   transform: scale(1);   }
      50%       { opacity: 0.3; transform: scale(0.65); }
    }

    .hero h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(5rem, 17vw, 11rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.025em;
      margin-bottom: 28px;
      color: #c8dcc8;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--green);
    }

    .hero-sub {
      font-size: clamp(0.95rem, 2.3vw, 1.15rem);
      font-weight: 300;
      color: var(--text-muted);
      max-width: 420px;
      margin: 0 auto;
      letter-spacing: 0.01em;
    }

    .hero-about {
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--green-muted);
      opacity: 0.8;
      max-width: 520px;
      margin: 14px auto 0;
    }

    /* ── Section label ── */
    .section-label {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
      font-size: inherit;
      font-weight: inherit;
    }

    .section-label span {
      font-size: 0.67rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--green);
      white-space: nowrap;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--border-hover), transparent);
    }

    /* ── Cards ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(74, 222, 128, 0.06) 0%, transparent 100%);
      opacity: 0;
      transition: opacity .22s ease;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: var(--border-hover);
      background: var(--surface-hover);
      box-shadow:
        0 20px 52px rgba(0, 0, 0, 0.45),
        0 0 32px rgba(74, 222, 128, 0.07);
    }

    .card:hover::before { opacity: 1; }

    .card-icon {
      width: 46px;
      height: 46px;
      background: var(--green-dim);
      border: 1px solid rgba(74, 222, 128, 0.18);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .card h3 {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }

    .card p {
      font-size: 0.845rem;
      font-weight: 300;
      color: var(--text-muted);
      line-height: 1.65;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .card-tag {
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--green);
    }

    .card-arrow {
      width: 17px;
      height: 17px;
      color: var(--green);
      opacity: 0.5;
      flex-shrink: 0;
      transition: transform .2s ease, opacity .2s ease;
    }

    .card:hover .card-arrow {
      transform: translate(4px, -4px);
      opacity: 1;
    }

    /* ── Badges ── */
    .badge {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 999px;
      line-height: 1.2;
    }

    .badge-new {
      background: var(--green);
      color: #052e16;
    }

    .badge-updated {
      border: 1px solid var(--border-hover);
      color: var(--green-muted);
    }

    /* ── Card buttons (mods) ── */
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      position: relative;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border-radius: 10px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border-hover);
      color: var(--green);
      background: transparent;
      transition: background .18s ease, border-color .18s ease, color .18s ease;
      white-space: nowrap;
    }

    .btn:hover { background: var(--green-dim); border-color: var(--green); }

    .btn-primary {
      background: var(--green);
      border-color: var(--green);
      color: #052e16;
    }

    .btn-primary:hover { background: var(--green-muted); border-color: var(--green-muted); }

    .btn:focus-visible, .card:focus-visible, .chip:focus-visible, .slide-nav:focus-visible, .dot:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }

    /* ── Featured slideshow ── */
    .featured { margin-bottom: 72px; }

    .slides-viewport {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-hover);
      border-radius: 22px;
      background: var(--surface);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.06);
    }

    .slides {
      display: flex;
      transition: transform .55s cubic-bezier(.22, .8, .3, 1);
    }

    .slide {
      flex: 0 0 100%;
      min-width: 0;
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 34px;
      align-items: center;
      padding: 44px 52px 76px;
      background: radial-gradient(ellipse 70% 90% at 0% 0%, rgba(74, 222, 128, 0.08) 0%, transparent 70%);
    }

    .slide-icon {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      background: var(--green-dim);
      border: 1px solid rgba(74, 222, 128, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      line-height: 1;
    }

    .slide-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .slide-meta .badge { position: static; }

    .slide h3 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(1.8rem, 4.4vw, 2.6rem);
      font-weight: 400;
      line-height: 1.05;
      margin-bottom: 12px;
    }

    .slide p {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 540px;
      margin-bottom: 22px;
    }

    .slide .card-actions { max-width: 360px; }

    .slide-controls {
      position: absolute;
      left: 52px;
      right: 52px;
      bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dots { display: flex; gap: 8px; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: 0;
      padding: 0;
      background: var(--border-hover);
      cursor: pointer;
      transition: width .25s ease, background .25s ease;
    }

    .dot[aria-current="true"] { width: 24px; background: var(--green); }

    .slide-navs { display: flex; gap: 8px; }

    .slide-nav {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-hover);
      background: transparent;
      color: var(--green);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .18s ease;
    }

    .slide-nav:hover { background: var(--green-dim); }
    .slide-nav svg { width: 14px; height: 14px; }

    /* ── Filter chips ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 40px;
    }

    .chip {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, color .18s ease;
    }

    .chip:hover { border-color: var(--border-hover); color: var(--text); }

    .chip[aria-pressed="true"] {
      background: var(--green-dim);
      border-color: var(--green);
      color: var(--green);
    }

    .chip-count { opacity: 0.55; margin-left: 4px; }

    /* ── Category sections ── */
    .category { margin-bottom: 56px; }
    .category[hidden], .card[hidden] { display: none; }

    /* ── Responsive ── */
    @media (max-width: 680px) {
      .slide {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 30px 24px 74px;
      }
      .slide-icon { width: 72px; height: 72px; font-size: 36px; border-radius: 18px; }
      .slide-controls { left: 24px; right: 24px; }
    }

    @media (max-width: 540px) {
      main { padding: 0 16px 80px; }
      .hero { padding: 90px 0 56px; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slides { transition: none; }
      .card, .card-arrow { transition: none; }
    }
  </style>
</head>

  <script>
    (function () {
      'use strict';

      // Section order and headings. A project whose category isn't listed
      // here gets its own section, headed by the raw category name.
      var CATEGORIES = [
        { id: 'garden', label: 'Outdoors & Garden' },
        { id: 'tools',  label: 'Browser Tools' },
        { id: 'mods',   label: 'Minecraft Mods' },
      ];
      var FEATURED_COUNT = 3;
      var BADGE_DAYS     = 30;
      var SLIDE_MS       = 6000;

      var ARROW = '<svg class="card-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13L13 3M13 3H6M13 3v7"/></svg>';

      var projects = JSON.parse(document.getElementById('projects-data').textContent);

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function daysAgo(dateStr) {
        if (!dateStr) return Infinity;
        var d = new Date(dateStr + 'T00:00:00');
        return (Date.now() - d.getTime()) / 86400000;
      }

      function badgeFor(p) {
        if (daysAgo(p.added) <= BADGE_DAYS)   return '<span class="badge badge-new">New</span>';
        if (daysAgo(p.updated) <= BADGE_DAYS) return '<span class="badge badge-updated">Updated</span>';
        return '';
      }

      // Mods (anything with a source repo) get Download + Source buttons.
      function actionsFor(p) {
        if (!p.source) return '';
        var dl = p.download || (p.source.replace(/\/$/, '') + '/releases/latest');
        var dlLabel = /curseforge\.com/i.test(dl) ? 'Download · CurseForge' : 'Download';
        return '<div class="card-actions">' +
          '<a class="btn btn-primary" href="' + esc(dl) + '">' + dlLabel + '</a>' +
          '<a class="btn" href="' + esc(p.source) + '">Source · GitHub</a>' +
          '</div>';
      }

      function cardHTML(p) {
        var inner =
          badgeFor(p) +
          '<div class="card-icon">' + esc(p.icon) + '</div>' +
          '<h3>' + esc(p.title) + '</h3>' +
          '<p>' + esc(p.desc) + '</p>';
        if (p.source) {
          return '<article class="card" data-tag="' + esc(p.tag) + '">' + inner +
            '<div class="card-footer"><span class="card-tag">' + esc(p.tag) + '</span></div>' +
            actionsFor(p) + '</article>';
        }
        return '<a href="' + esc(p.url) + '" class="card" data-tag="' + esc(p.tag) + '">' + inner +
          '<div class="card-footer"><span class="card-tag">' + esc(p.tag) + '</span>' + ARROW + '</div></a>';
      }

      // ── Category sections ──
      var cats = CATEGORIES.slice();
      projects.forEach(function (p) {
        if (!cats.some(function (c) { return c.id === p.category; })) {
          cats.push({ id: p.category, label: p.category || 'Other' });
        }
      });

      document.getElementById('categories').innerHTML = cats.map(function (c) {
        var items = projects.filter(function (p) { return p.category === c.id; });
        if (!items.length) return '';
        return '<section class="category" aria-label="' + esc(c.label) + '">' +
          '<h2 class="section-label"><span>' + esc(c.label) + '</span></h2>' +
          '<div class="grid">' + items.map(cardHTML).join('') + '</div></section>';
      }).join('');

      // ── Filter chips ──
      var tags = [];
      projects.forEach(function (p) { if (tags.indexOf(p.tag) === -1) tags.push(p.tag); });
      var filtersEl = document.getElementById('filters');
      filtersEl.innerHTML = ['All'].concat(tags).map(function (t) {
        var n = t === 'All' ? projects.length : projects.filter(function (p) { return p.tag === t; }).length;
        return '<button type="button" class="chip" data-filter="' + esc(t) + '" aria-pressed="' + (t === 'All') + '">' +
          esc(t) + '<span class="chip-count">' + n + '</span></button>';
      }).join('');

      filtersEl.addEventListener('click', function (e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        var f = chip.getAttribute('data-filter');
        filtersEl.querySelectorAll('.chip').forEach(function (c) {
          c.setAttribute('aria-pressed', String(c === chip));
        });
        document.querySelectorAll('.category').forEach(function (sec) {
          var visible = 0;
          sec.querySelectorAll('.card').forEach(function (card) {
            var show = f === 'All' || card.getAttribute('data-tag') === f;
            card.hidden = !show;
            if (show) visible++;
          });
          sec.hidden = visible === 0;
        });
      });

      // ── Featured slideshow: the most recently added projects ──
      var featured = projects.slice().sort(function (a, b) {
        return (b.added || '').localeCompare(a.added || '');
      }).slice(0, FEATURED_COUNT);

      var slidesEl = document.getElementById('slides');
      var dotsEl   = document.getElementById('dots');

      slidesEl.innerHTML = featured.map(function (p, i) {
        var cta = p.source ? actionsFor(p)
          : '<div class="card-actions"><a class="btn btn-primary" href="' + esc(p.url) + '">Open ' + esc(p.title) + '</a></div>';
        return '<div class="slide" role="group" aria-roledescription="slide" aria-label="' + (i + 1) + ' of ' + featured.length + '">' +
          '<div class="slide-icon" aria-hidden="true">' + esc(p.icon) + '</div>' +
          '<div><div class="slide-meta">' + badgeFor(p) + '<span class="card-tag">' + esc(p.tag) + '</span></div>' +
          '<h3>' + esc(p.title) + '</h3><p>' + esc(p.desc) + '</p>' + cta + '</div></div>';
      }).join('');

      dotsEl.innerHTML = featured.map(function (p, i) {
        return '<button type="button" class="dot" data-i="' + i + '" aria-label="Show ' + esc(p.title) + '"></button>';
      }).join('');

      var slideEls = slidesEl.children;
      var current  = 0;
      var timer    = null;
      var reduced  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function go(i) {
        current = (i + featured.length) % featured.length;
        slidesEl.style.transform = 'translateX(' + (-100 * current) + '%)';
        for (var k = 0; k < slideEls.length; k++) {
          var on = k === current;
          slideEls[k].setAttribute('aria-hidden', String(!on));
          slideEls[k].inert = !on;
          dotsEl.children[k].setAttribute('aria-current', String(on));
        }
      }

      function stop()  { clearInterval(timer); timer = null; }
      function start() {
        stop();
        if (!reduced && featured.length > 1) timer = setInterval(function () { go(current + 1); }, SLIDE_MS);
      }

      document.getElementById('prev').addEventListener('click', function () { go(current - 1); start(); });
      document.getElementById('next').addEventListener('click', function () { go(current + 1); start(); });
      dotsEl.addEventListener('click', function (e) {
        var d = e.target.closest('.dot');
        if (d) { go(+d.getAttribute('data-i')); start(); }
      });

      var viewport = document.getElementById('featured');
      viewport.addEventListener('mouseenter', stop);
      viewport.addEventListener('mouseleave', start);
      viewport.addEventListener('focusin', stop);
      viewport.addEventListener('focusout', start);

      var touchX = null;
      viewport.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; stop(); }, { passive: true });
      viewport.addEventListener('touchend', function (e) {
        if (touchX === null) return;
        var dx = e.changedTouches[0].clientX - touchX;
        if (Math.abs(dx) > 40) go(current + (dx < 0 ? 1 : -1));
        touchX = null;
        start();
      });

      if (featured.length < 2) document.querySelector('.slide-controls').hidden = true;
      go(0);
      start();
    }());
  </script>


  <script>
    (function () {
      'use strict';

      // Per-leaf: [base x%, fall duration (s), total rotation (deg), total x-drift (px), opacity]
      var CONFIGS = [
        [ 7, 18,  380,  44, 0.08],
        [20, 23, -290, -28, 0.10],
        [35, 19,  410,  52, 0.09],
        [52, 26, -350, -42, 0.07],
        [68, 16,  460,  33, 0.11],
        [84, 21, -320, -48, 0.08],
        [13, 24,  340,  62, 0.09],
        [46, 17, -400, -22, 0.12],
        [60, 22,  390,  43, 0.07],
        [91, 20, -360, -33, 0.10],
        [29, 25,  430,  48, 0.08],
        [75, 15, -370, -38, 0.11],
        [ 2, 17,  420,  38, 0.09],
        [11, 22, -310, -35, 0.08],
        [25, 20,  360,  48, 0.10],
        [40, 15, -440, -26, 0.07],
        [49, 24,  310,  55, 0.11],
        [64, 18, -380, -40, 0.09],
        [77, 21,  450,  30, 0.08],
        [90, 16, -290, -52, 0.12],
        [16, 23,  395,  42, 0.07],
        [33, 19, -420, -32, 0.10],
        [57, 25,  330,  58, 0.08],
        [86, 14, -350, -44, 0.11],
      ];

      // Where in the fall cycle each leaf starts (0 = top, 1 = bottom).
      var INIT_Y = [
        0.000, 0.217, 0.579, 0.115, 0.500, 0.667, 0.792, 0.235,
        0.591, 0.350, 0.680, 0.133, 0.450, 0.080, 0.720, 0.280,
        0.550, 0.850, 0.160, 0.620, 0.380, 0.900, 0.050, 0.480,
      ];

      var REPEL_R = 110;   // px radius that triggers repulsion
      var REPEL_F = 12;    // force magnitude
      var DAMPING = 0.88;  // velocity decay per frame (at 60 fps)
      var VEL_CAP = 20;    // max velocity (px/frame)

      var mouse  = { x: -9999, y: -9999 };
      var leafEls = Array.from(document.querySelectorAll('.leaf'));

      function buildLeaves() {
        var vw     = window.innerWidth;
        var vh     = window.innerHeight;
        var totalH = vh + 160;

        return leafEls.map(function (el, i) {
          var cfg     = CONFIGS[i];
          var basePct = cfg[0];
          var durSec  = cfg[1];
          var rotDeg  = cfg[2];
          var dxPx    = cfg[3];
          var opacity = cfg[4];
          var frames  = durSec * 60;

          el.style.animation = 'none';
          el.style.opacity   = opacity;

          var halfW = el.offsetWidth  / 2 || 12;
          var halfH = el.offsetHeight / 2 || halfW * 1.67;

          return {
            el:       el,
            halfW:    halfW,
            halfH:    halfH,
            x:        basePct / 100 * vw,
            y:        -80 + INIT_Y[i] * totalH,
            vx:       0,
            vy:       0,
            speed:    totalH / frames,
            drift:    dxPx   / frames,
            rot:      Math.random() * 360,
            rotSpeed: rotDeg / frames,
            basePct:  basePct / 100,
          };
        });
      }

      var leaves = buildLeaves();

      window.addEventListener('resize', function () { leaves = buildLeaves(); }, { passive: true });

      document.addEventListener('mousemove', function (e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      document.addEventListener('mouseleave', function () {
        mouse.x = -9999;
        mouse.y = -9999;
      });
      document.addEventListener('touchmove', function (e) {
        var t = e.touches[0];
        if (t) { mouse.x = t.clientX; mouse.y = t.clientY; }
      }, { passive: true });
      document.addEventListener('touchend', function () {
        mouse.x = -9999;
        mouse.y = -9999;
      });

      var lastTs = 0;

      function tick(ts) {
        var dt = lastTs ? Math.min((ts - lastTs) / 16.667, 3) : 1;
        lastTs = ts;

        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var mx = mouse.x;
        var my = mouse.y;

        for (var i = 0; i < leaves.length; i++) {
          var lf = leaves[i];

          // Normal fall + drift + spin
          lf.y   += lf.speed    * dt;
          lf.x   += lf.drift    * dt;
          lf.rot += lf.rotSpeed * dt;

          // Repulsion: push leaf away when cursor is within REPEL_R of its center
          var cx   = lf.x + lf.halfW;
          var cy   = lf.y + lf.halfH;
          var dx   = cx - mx;
          var dy   = cy - my;
          var dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < REPEL_R && dist > 1) {
            var strength = (1 - dist / REPEL_R) * REPEL_F;
            lf.vx += (dx / dist) * strength * dt;
            lf.vy += (dy / dist) * strength * dt;
          }

          // Clamp & apply velocity
          if (lf.vx >  VEL_CAP) lf.vx =  VEL_CAP;
          if (lf.vx < -VEL_CAP) lf.vx = -VEL_CAP;
          if (lf.vy >  VEL_CAP) lf.vy =  VEL_CAP;
          if (lf.vy < -VEL_CAP) lf.vy = -VEL_CAP;

          lf.x  += lf.vx * dt;
          lf.y  += lf.vy * dt;

          // Frame-rate-independent damping
          var damp = Math.pow(DAMPING, dt);
          lf.vx *= damp;
          lf.vy *= damp;

          // Recycle when past the bottom
          if (lf.y > vh + 80) {
            lf.y  = -80;
            lf.x  = lf.basePct * vw;
            lf.vx = 0;
            lf.vy = 0;
          }

          lf.el.style.transform = 'translate(' + lf.x + 'px,' + lf.y + 'px) rotate(' + lf.rot + 'deg)';
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }());
  </script>
